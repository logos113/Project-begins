# ============================================================
#  실적 발표 일정 출처 찾기 (한 번 쓰고 지울 워크플로)
#
#  "그날 실적을 발표하는 기업 전체" 를 받아올 수 있는 곳을 찾습니다.
#  그러면 일꾼은 명단만 올려두고, 앱이 그중에서 내 관심 종목을
#  골라내면 됩니다 — 관심 종목을 저장소에 올리지 않아도 됩니다.
# ============================================================

name: 실적 일정 출처 찾기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/earnings-probe.yml"
      - "stocks/collect/earnings-probe.mjs"

permissions:
  contents: write

concurrency:
  group: earnings-probe
  cancel-in-progress: false

jobs:
  # job 이름은 반드시 영문입니다
  probe:
    name: 실적 일정 두드려보기
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 두드려보기
        run: node stocks/collect/earnings-probe.mjs

      - name: 결과 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/data/_earn_probe.json
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다"
            exit 0
          fi
          git commit -m "정찰: 실적 일정 출처 두드려보기"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          exit 1
