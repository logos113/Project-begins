# ============================================================
#  일정 사이트 정찰 (한 번 쓰고 지울 워크플로)
#
#  FOMC·금통위·CPI 일정을 긁어오려는데 사이트 구조를 모릅니다.
#  추측으로 파서를 짜면 '그럴듯하게 틀린 날짜' 가 나오고,
#  투자 일정에서 그건 없느니만 못합니다.
#
#  그래서 일꾼이 먼저 다녀와 구조를 떠옵니다.
#  결과를 보고 진짜 파서를 짜면, 이 파일과 calendar-probe.mjs 는 지웁니다.
# ============================================================

name: 일정 사이트 정찰

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calendar-probe.yml"
      - "stocks/collect/calendar-probe.mjs"

permissions:
  contents: write

concurrency:
  group: calendar-probe
  cancel-in-progress: false

jobs:
  # job 이름은 반드시 영문입니다 (한국어면 워크플로가 조용히 안 돕니다)
  probe:
    name: 일정 사이트 다녀오기
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 정찰
        run: node stocks/collect/calendar-probe.mjs

      - name: 결과 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/data/_probe.json
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다"
            exit 0
          fi
          git commit -m "정찰: 일정 사이트 구조 떠오기"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          exit 1
