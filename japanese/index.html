<!DOCTYPE html>
<!--
  ============================================================
  japanese/index.html  =  일본어 여행 회화 앱의 "뼈대"
  ------------------------------------------------------------
  HTML은 "무엇이 있는가"를 적는 언어입니다.
  <태그> 내용 </태그>  형태로 쓰며, 여는 태그와 닫는 태그가 짝을 이룹니다.

  이 폴더(japanese/)는 논문 앱과 완전히 분리되어 있습니다.
  파일 이름이 같아도(index.html, app.js …) 폴더가 다르므로 서로 영향이 없습니다.

  ※ 주의 — 주석 안에 또 주석을 넣으면 안 됩니다.
     주석은 "가장 먼저 나오는 닫는 표시"에서 끝나버려서,
     그 뒤의 글자가 화면에 그대로 노출되고 페이지 구조가 깨집니다.
     논문 앱에서 실제로 겪은 실수라, tests/japanese.test.mjs 가 이 부분을 검사합니다.
  ============================================================
-->
<html lang="ko">
<head>
  <!-- head 안의 내용은 화면에 안 보입니다. 브라우저에게 주는 설명서입니다. -->

  <!-- 한글·일본어가 깨지지 않게 하는 설정. 반드시 있어야 합니다. -->
  <meta charset="UTF-8">

  <!-- 휴대폰에서도 화면 크기에 맞게 보이도록 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 브라우저 탭에 표시되는 이름 -->
  <title>오늘의 일본어 여행 회화</title>

  <!-- ↓ 아이폰·아이패드에서 "홈 화면에 추가"했을 때 앱처럼 보이게 하는 설정들 -->
  <meta name="apple-mobile-web-app-title" content="일본어 회화">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta name="theme-color" content="#b03a2e">

  <!-- 데스크탑(크롬·엣지)에서 '앱으로 설치'가 가능하도록 알려주는 파일입니다. -->
  <link rel="manifest" href="manifest.json">

  <!-- 우리가 만든 디자인 파일을 불러옵니다 -->
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
  <!-- body 안의 내용이 실제로 화면에 보이는 부분입니다. -->

  <!-- ========== 1) 맨 위 머리말 ========== -->
  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">旅の日本語 · Travel Japanese</p>
      <h1>오늘의 일본어 여행 회화</h1>
      <p class="lede">
        여행에서 바로 쓰는 표현을 매일 <strong>3개</strong>씩 익힙니다.
      </p>
      <!-- id가 붙은 곳은 나중에 app.js가 내용을 채워 넣는 자리입니다 -->
      <p class="today" id="todayLabel"></p>

      <!-- 지금까지의 학습 상황 (연속 일수 · 익힌 개수 · 복습할 개수) -->
      <div class="stats" id="statsBox"></div>
    </div>
  </header>

  <main class="wrap">

    <!-- ========== 2) 보기 방식을 고르는 곳 ========== -->
    <section class="controls" aria-label="학습 설정">

      <div class="control">
        <label for="sceneSelect">상황</label>
        <!-- select = 여러 개 중 하나를 고르는 드롭다운 메뉴 -->
        <!-- 상황 목록은 phrases.js 에 적혀 있고, app.js 가 이 안을 채웁니다 -->
        <select id="sceneSelect">
          <option value="all">전체 상황</option>
        </select>
      </div>

      <div class="control">
        <label for="modeSelect">연습 방식</label>
        <select id="modeSelect">
          <option value="뜻먼저">한국어 뜻 보고 → 일본어 떠올리기</option>
          <option value="일본어먼저">일본어 보고 → 뜻 떠올리기</option>
          <option value="바로보기">바로 다 보여주기</option>
        </select>
      </div>

      <div class="control">
        <label for="readingSelect">발음 표기</label>
        <select id="readingSelect">
          <option value="all">히라가나 + 로마자 + 한글</option>
          <option value="kana">히라가나만 (글자 익히기)</option>
          <option value="korean">한글 발음만 (급할 때)</option>
        </select>
      </div>

      <!-- button = 누를 수 있는 버튼 -->
      <!-- 이 버튼들의 글자는 app.js 가 상황에 맞게 바꿉니다 -->
      <button id="savedBtn" class="btn-secondary" type="button">저장한 표현</button>
      <button id="quizBtn" class="btn-secondary" type="button">복습 퀴즈</button>
      <button id="refreshBtn" class="btn-primary" type="button">다른 표현 보기</button>
    </section>

    <!-- ========== 3) 상태 메시지 자리 (안내 / 오류) ========== -->
    <!-- hidden 을 붙이면 평소엔 숨어 있고, 필요할 때 app.js가 보여줍니다 -->
    <div id="statusBox" class="status" hidden></div>

    <!-- ========== 4) 표현 카드가 들어갈 자리 ========== -->
    <!-- 지금은 비어 있고, app.js가 여기에 오늘의 표현 3개를 만들어 넣습니다 -->
    <section id="phraseList" class="phrase-list"></section>

    <!-- ========== 5) 복습 퀴즈가 들어갈 자리 ========== -->
    <!-- 평소엔 숨어 있다가 '복습 퀴즈' 버튼을 누르면 나타납니다 -->
    <section id="quizBox" class="quiz" hidden></section>

  </main>

  <!-- ========== 6) 맨 아래 꼬리말 ========== -->
  <footer class="site-footer">
    <div class="wrap">
      <p>
        표현은 <code>phrases.js</code> 파일에 들어 있습니다. 직접 더하거나 고치셔도 됩니다.
        발음 듣기는 기기에 들어 있는 일본어 음성을 씁니다(인터넷·비용 불필요).
      </p>
      <p class="disclaimer">
        학습 기록은 이 기기 안에만 저장됩니다. 다른 기기로는 넘어가지 않고,
        브라우저 기록을 지우면 함께 지워집니다.
      </p>
      <!-- 지금 보고 있는 화면이 최신인지 확인하는 자리입니다.
           app.js 가 스스로 자기 버전을 읽어서 채웁니다. -->
      <p class="version">화면 버전 <span id="appVersion">확인 중</span></p>
    </div>
  </footer>

  <!-- 표현 목록(교재)을 먼저 불러오고, 그다음 동작(app.js)을 불러옵니다.
       순서가 중요합니다 — app.js 는 표현 목록이 이미 있다고 생각하고 움직입니다. -->
  <!-- ?v=1 은 "이 파일이 바뀌었다"고 브라우저에 알리는 표시입니다.
       브라우저는 한 번 받은 파일을 한동안 저장해두고 다시 받지 않는데(캐시),
       주소가 달라지면 새 파일로 보고 다시 받아옵니다.
       코드를 크게 고친 뒤에는 이 숫자를 올려주세요. -->
  <script src="phrases.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
