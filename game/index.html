<!DOCTYPE html>
<!--
  ============================================================
  점프 게임 - index.html

  이 파일은 게임 화면의 "뼈대" 입니다.
  실제로 게임이 움직이는 것은 game.js 가 담당합니다.

  게임을 바꿔보고 싶으면 game.js 맨 위의 '설정' 부분을 여세요.
  숫자만 바꿔도 게임이 완전히 달라집니다.
  ============================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=no : 게임 중에 두 손가락으로 화면이 확대되지 않게 막습니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>점프! 로봇</title>

  <!-- 홈 화면에 추가했을 때 앱처럼 보이게 하는 설정들 -->
  <meta name="apple-mobile-web-app-title" content="점프! 로봇">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/game-icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/game-icon-152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/game-favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b2a4a">

  <link rel="stylesheet" href="style.css?v=1">
</head>

<body>

  <!-- 게임 그림이 그려지는 곳.
       canvas(캔버스) = 그림을 그릴 수 있는 도화지 같은 태그입니다.
       여기에 game.js 가 로봇, 장애물, 배경을 하나하나 그립니다. -->
  <canvas id="gameCanvas"></canvas>

  <!-- 게임 위에 겹쳐서 보이는 글자들 -->
  <div id="hud" class="hud">
    <div class="score-box">
      <span class="score-label">점수</span>
      <span id="score">0</span>
    </div>
    <div class="score-box best">
      <span class="score-label">최고</span>
      <span id="best">0</span>
    </div>
    <!-- 소리 켜고 끄는 버튼 -->
    <button id="soundBtn" class="sound-btn" type="button" aria-label="소리 켜기/끄기">🔊</button>
  </div>

  <!-- 시작 화면 / 게임오버 화면.
       평소엔 숨어 있다가 game.js 가 필요할 때 보여줍니다. -->
  <div id="overlay" class="overlay">
    <div class="panel">
      <h1 id="overlayTitle">점프! 로봇</h1>
      <p id="overlayText">화면을 톡 누르면 점프해요<br>장애물을 피해서 멀리 가보세요</p>

      <div id="resultBox" class="result" hidden>
        <div class="result-row"><span>이번 점수</span><strong id="finalScore">0</strong></div>
        <div class="result-row"><span>최고 점수</span><strong id="finalBest">0</strong></div>
        <p id="newRecord" class="new-record" hidden>🎉 신기록!</p>
      </div>

      <button id="startBtn" class="start-btn" type="button">시작하기</button>

      <p class="hint">
        공중에서 한 번 더 누르면 <strong>두 번 점프</strong>할 수 있어요
      </p>
    </div>
  </div>

  <script src="game.js?v=1"></script>
</body>
</html>
